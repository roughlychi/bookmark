<!DOCTYPE html>
<html lang="ko" data-theme="dark"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>북마크 관리자</title>

  <!-- 파비콘 (자주 가는 사이트 별 아이콘) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z' fill='%23fdd663'/%3E%3C/svg%3E">

  <!-- SortableJS (드래그 앤 드롭 지원) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <!-- Google Material Symbols (아이콘) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    /* =========================================================
       Design tokens — monochrome, hairline, minimal
       (typing.works 의 절제된 흑백 톤 + Google Fonts Icons 의 깔끔한 Material 톤)
    ========================================================= */
    :root {
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --surface-hover: #f4f4f5;
      --surface-active: #ececee;
      --text-color: #111111;
      --text-muted: #6b6b70;
      --text-subtle: #a1a1a6;
      --border-color: #e7e7ea;
      --border-strong: #cfcfd4;
      --primary-color: #111111;
      --primary-hover: #333333;
      --on-primary: #ffffff;
      --star-color: #f5b301;
      --danger-color: #e5484d;
      --focus-ring: rgba(17, 17, 17, 0.14);
      --modal-bg: rgba(10, 10, 12, 0.45);
      --glass-bg: rgba(250, 250, 250, 0.82);
      --radius-sm: 0;
      --radius-md: 0;
      --radius-lg: 0;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    [data-theme="dark"] {
      /* Google Fonts 다크 테마 팔레트 */
      --bg-color: #202124;
      --card-bg: #292a2d;
      --surface-hover: #35363a;
      --surface-active: #3c4043;
      --text-color: #e8eaed;
      --text-muted: #9aa0a6;
      --text-subtle: #80868b;
      --border-color: #3c4043;
      --border-strong: #5f6368;
      --primary-color: #e8eaed;
      --primary-hover: #bdc1c6;
      --on-primary: #202124;
      --star-color: #fdd663;
      --danger-color: #f28b82;
      --focus-ring: rgba(232, 234, 237, 0.2);
      --modal-bg: rgba(0, 0, 0, 0.65);
      --glass-bg: rgba(32, 33, 36, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s, color .2s;
    }

    input[type="text"], textarea { ime-mode: active; }

    /* Material Symbols 기본 설정 */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 20px;
      line-height: 1;
      user-select: none;
      flex-shrink: 0;
      display: inline-block;
      width: 1em;
      height: 1em;
      overflow: hidden;      /* 폰트 로딩 전 글자(ligature)가 보이지 않도록 고정 */
      white-space: nowrap;
    }
    .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    :focus-visible { outline: 2px solid var(--text-color); outline-offset: 2px; }

    .container { max-width: 1320px; margin: 0 auto; padding: 0 28px 64px 28px; }

    /* =========================================================
       Header
    ========================================================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 28px;
      margin-left: -28px;
      margin-right: -28px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 32px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-color);
    }
    h1 .logo-mark {
      width: 30px; height: 30px;
      border-radius: 0;
      background: var(--primary-color);
      color: var(--on-primary);
      display: inline-flex; align-items: center; justify-content: center;
    }
    h1 .logo-mark .material-symbols-outlined { font-size: 18px; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* Search (Google Fonts 스타일의 필 형태 검색창) */
    .search-bar { position: relative; flex-grow: 1; width: 300px; max-width: 100%; }
    .search-bar input {
      width: 100%;
      height: 40px;
      padding: 0 44px 0 42px;
      border-radius: 0;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background-color .2s;
    }
    .search-bar input::placeholder { color: var(--text-subtle); }
    .search-bar input:hover { border-color: var(--border-strong); }
    .search-bar input:focus { border-color: var(--text-color); box-shadow: 0 0 0 4px var(--focus-ring); }
    .search-bar > .material-symbols-outlined { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); font-size: 20px; pointer-events: none; }
    .search-bar kbd {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-size: 0.7rem; color: var(--text-subtle);
      border: 1px solid var(--border-color); border-radius: 0; padding: 1px 6px; background: var(--bg-color);
      pointer-events: none;
    }
    .search-bar input:focus ~ kbd, .search-bar input:not(:placeholder-shown) ~ kbd { display: none; }

    /* Buttons */
    button {
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 0;
      padding: 0 14px;
      height: 40px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      white-space: nowrap;
      transition: background-color .15s, color .15s, border-color .15s, opacity .15s, transform .1s;
    }
    button:active { transform: scale(0.97); }
    button .material-symbols-outlined { font-size: 18px; }

    .btn-primary { background-color: var(--primary-color); color: var(--on-primary); }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: var(--card-bg); color: var(--text-color); border-color: var(--border-color); }
    .btn-secondary:hover { background-color: var(--surface-hover); border-color: var(--border-strong); }
    .btn-danger { background-color: transparent; color: var(--danger-color); border-color: var(--border-color); }
    .btn-danger:hover { background-color: var(--danger-color); border-color: var(--danger-color); color: #fff; }

    /* 아이콘 전용 버튼 (헤더 테마 토글 등) */
    .btn-secondary.btn-icon { width: 40px; padding: 0; }

    /* 리스트 내 아이콘 버튼 */
    .btn-icon {
      width: 28px; height: 28px; padding: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text-subtle);
      border: none;
    }
    .btn-icon .material-symbols-outlined { font-size: 18px; }
    .btn-icon:hover { background-color: var(--surface-active); color: var(--text-color); }

    /* =========================================================
       Categories (Masonry)
    ========================================================= */
    .categories-grid { column-width: 300px; column-gap: 20px; }

    .category-card {
      break-inside: avoid;
      margin-bottom: 20px;
      background-color: var(--card-bg);
      border-radius: 0;
      border: 1px solid var(--border-color);
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .15s, background-color .2s;
    }
    .category-card:hover { border-color: var(--border-strong); }

    /* 자주 가는 사이트 (고정 폴더) */
    .category-card.starred-folder { border-color: var(--text-color); }
    .category-card.starred-folder .category-title { padding-left: 6px; }
    .category-card.starred-folder .category-header { border-bottom-color: var(--text-color); }
    .category-card.starred-folder .category-title .material-symbols-outlined { color: var(--star-color); font-size: 18px; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 46px;
      padding: 0 8px 0 8px;
      background-color: var(--bg-color);       /* 폴더 헤더 영역을 본문과 다른 톤으로 구분 */
      border-bottom: 1px solid var(--border-color);
    }
    .category-title {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-grow: 1;
      min-width: 0;
      margin-right: 6px;
      color: var(--text-color);
    }
    .category-title-text {
      cursor: text;
      padding: 4px 8px;
      border-radius: 0;
      border: 1px solid transparent;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      min-width: 0;
    }
    .category-title-text:hover { background-color: var(--surface-hover); }
    .category-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-subtle);
      margin-left: 2px;
      flex-shrink: 0;
    }
    .category-edit-input {
      font-size: 0.85rem; font-weight: 700; font-family: inherit;
      padding: 4px 8px; border-radius: 0;
      border: 1px solid var(--text-color);
      background-color: var(--card-bg); color: var(--text-color);
      width: 100%; outline: none; box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .category-header .btn-icon { opacity: 0; }
    .category-card:hover .category-header .btn-icon,
    .category-header .btn-icon:focus-visible { opacity: 1; }
    .category-header .btn-icon:hover { color: var(--danger-color); }

    /* 이동(드래그) 아이콘 — 모든 곳에서 동일한 drag_handle 하나로 통일 */
    .drag-handle {
      cursor: grab;
      color: var(--text-subtle);
      font-size: 20px !important;
      width: 20px;
      height: 20px;
      text-align: center;
      border-radius: 0;
      opacity: 0.55;
      transition: opacity .15s, color .15s;
    }
    .drag-handle:hover { opacity: 1; color: var(--text-color); }
    .drag-handle:active { cursor: grabbing; }

    /* =========================================================
       Bookmark list — [이동]  제목 ........ [연필][별]
    ========================================================= */
    .bookmark-list { list-style: none; flex-grow: 1; min-height: 28px; padding: 8px 8px 8px 8px; }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px 4px 2px 4px;
      border-radius: 0;
      background-color: transparent;
      transition: background-color .12s;
    }
    .bookmark-item:hover, .bookmark-item:focus-within { background-color: var(--surface-hover); }
    .starred-folder .bookmark-item { padding-left: 6px; }

    .bookmark-info {
      display: flex;
      align-items: center;
      overflow: hidden;
      text-decoration: none;
      color: var(--text-color);
      flex-grow: 1;
      min-width: 0;
      min-height: 34px;
      padding: 0 6px;
      border-radius: 0;
    }
    .bookmark-details { overflow: hidden; min-width: 0; }
    .bookmark-title { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
    .bookmark-desc { font-size: 0.74rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; padding-bottom: 3px; }
    .bookmark-info:hover .bookmark-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

    /* 오른쪽 액션 영역: 연필 + 별 (별이 가장 오른쪽) */
    .bookmark-actions { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
    .bookmark-actions .btn-icon { opacity: 0; }
    .bookmark-item:hover .bookmark-actions .btn-icon,
    .bookmark-item:focus-within .bookmark-actions .btn-icon { opacity: 1; }
    /* 별이 켜진 항목은 항상 보이게 */
    .bookmark-actions .star-btn-inline.is-on { opacity: 1; }

    .star-icon { font-size: 18px !important; color: var(--text-subtle); }
    .star-btn-inline:hover .star-icon { color: var(--star-color); }
    .star-icon.active { color: var(--star-color) !important; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* 드래그 상태 */
    .sortable-ghost { opacity: 0.35; background-color: var(--surface-active) !important; }
    .sortable-chosen { background-color: var(--card-bg); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

    .list-empty { font-size: 0.8rem; color: var(--text-subtle); padding: 8px 10px; }

    .empty-state {
      column-span: all;
      text-align: center;
      padding: 96px 16px;
      color: var(--text-muted);
    }
    .empty-state .material-symbols-outlined { font-size: 40px; color: var(--text-subtle); margin-bottom: 12px; display: block; }
    .empty-state p { font-size: 0.9rem; }

    /* =========================================================
       Modal
    ========================================================= */
    .modal {
      display: none;
      position: fixed; inset: 0;
      background: var(--modal-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      justify-content: center; align-items: center;
      z-index: 1000; padding: 16px;
    }
    .modal.active { display: flex; animation: fadeIn .15s ease; }
    .modal-content {
      background-color: var(--card-bg);
      border-radius: 0;
      padding: 24px;
      width: 100%; max-width: 440px;
      border: 1px solid var(--border-color);
      box-shadow: 0 24px 60px -12px rgba(0,0,0,0.25);
      animation: popIn .18s ease;
    }
    .modal-header {
      font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .star-toggle-btn {
      cursor: pointer; background: transparent; border: none;
      width: 36px; height: 36px; padding: 0; border-radius: 0;
      color: var(--text-subtle);
      display: flex; align-items: center; justify-content: center;
    }
    .star-toggle-btn:hover { background-color: var(--surface-hover); }
    .star-toggle-btn .material-symbols-outlined { font-size: 24px; }
    .star-toggle-btn.active .material-symbols-outlined { color: var(--star-color); font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0 12px;
      height: 42px;
      border-radius: 0;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-group textarea { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
    .form-group input:hover, .form-group select:hover, .form-group textarea:hover { border-color: var(--border-strong); }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--text-color); box-shadow: 0 0 0 4px var(--focus-ring); }
    .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; }
    .form-actions-right { display: flex; gap: 8px; margin-left: auto; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 28px;
      transform: translate(-50%, 20px);
      background: var(--primary-color); color: var(--on-primary);
      padding: 11px 18px; border-radius: 0;
      font-size: 0.85rem; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 2000;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast .material-symbols-outlined { font-size: 18px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }

    /* 터치 기기: hover 가 없으므로 액션 아이콘 항상 표시 */
    @media (hover: none) {
      .bookmark-actions .btn-icon, .category-header .btn-icon { opacity: 1; }
      .btn-icon { width: 36px; height: 36px; }
      .bookmark-info { min-height: 42px; }
    }

    @media (max-width: 900px) {
      .btn-label { display: none; }
      .actions button:not(.btn-primary) { padding: 0; width: 40px; }
    }

    @media (max-width: 600px) {
      .container { padding: 0 16px 48px 16px; }
      header { flex-direction: column; align-items: stretch; margin-left: -16px; margin-right: -16px; padding: 14px 16px; margin-bottom: 20px; gap: 12px; }
      .search-bar { width: 100%; }
      .actions { justify-content: space-between; }
      .actions .btn-primary { padding: 0 14px; width: auto; }
      .categories-grid { column-width: auto; column-count: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>
        <span class="logo-mark"><span class="material-symbols-outlined">bookmark</span></span>
        내 북마크
      </h1>
      <div class="actions">
        <div class="search-bar">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="searchInput" placeholder="제목 또는 URL 검색" autocomplete="off" oninput="render()">
          <kbd>/</kbd>
        </div>
        <button class="btn-secondary" onclick="openCategoryModal()" title="새 폴더 추가">
          <span class="material-symbols-outlined">create_new_folder</span><span class="btn-label">폴더</span>
        </button>
        <button class="btn-primary" onclick="openBookmarkModal()" title="새 북마크 추가">
          <span class="material-symbols-outlined">add</span><span class="btn-label">북마크</span>
        </button>
        <button class="btn-secondary" onclick="copyUpdatedHtml()" title="현재 정리를 반영한 새 HTML 코드 복사">
          <span class="material-symbols-outlined">content_copy</span><span class="btn-label">코드 복사</span>
        </button>
        <button class="btn-secondary" onclick="resetToDefault()" title="코드 내장 기본값으로 복원">
          <span class="material-symbols-outlined">restart_alt</span><span class="btn-label">초기화</span>
        </button>
        <button class="btn-secondary btn-icon" onclick="toggleDarkMode()" title="다크모드 토글">
          <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        </button>
      </div>
    </header>

    <div id="categoriesContainer" class="categories-grid"></div>
  </div>

  <!-- 카테고리 모달 -->
  <div id="categoryModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="catModalTitle">새 폴더 추가</span>
      </div>
      <form id="categoryForm" onsubmit="saveCategory(event)">
        <input type="hidden" id="catId" value="">
        <div class="form-group">
          <label for="catName">폴더 이름</label>
          <input type="text" id="catName" required="" autocomplete="off">
        </div>
        <div class="form-actions">
          <div class="form-actions-right">
            <button type="button" class="btn-secondary" onclick="closeModal('categoryModal')">취소</button>
            <button type="submit" class="btn-primary">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 북마크 모달 -->
  <div id="bookmarkModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="bmModalTitle">북마크 수정</span>
        <button type="button" id="starToggleBtn" class="star-toggle-btn" onclick="toggleStarState()" title="중요 북마크 설정">
          <span class="material-symbols-outlined">star</span>
        </button>
      </div>
      <form id="bookmarkForm" onsubmit="saveBookmark(event)">
        <input type="hidden" id="bmId" value="">
        <input type="hidden" id="bmIsStarred" value="false">
        <div class="form-group">

      "url": "https://www.all.go.kr/main/viewMain.do",
      "desc": "",
      "isStarred": false
    }
  ]
};

    let state = loadData();

    function loadData() {
      const saved = localStorage.getItem('bookmark_app_data');
      let data = null;
      if (saved) {
        try { data = JSON.parse(saved); } catch(e){}
      }
      if (!data) data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      /* 테마는 별도 키로 관리 (없으면 코드 기본값 = 다크) */
      data.theme = localStorage.getItem('bookmark_app_theme') || DEFAULT_DATA.theme || 'dark';
      return data;
    }

    function saveData() {
      localStorage.setItem('bookmark_app_data', JSON.stringify(state));
    }

    /* 표시용: 폴더 이름에 남아 있을 수 있는 이모지를 화면에서 제거 (데이터는 그대로) */
    function displayName(str) {
      return String(str).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '').trim();
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme || 'light');
      const icon = document.getElementById('themeIcon');
      if (icon) icon.textContent = state.theme === 'dark' ? 'light_mode' : 'dark_mode';
    }

    function toggleDarkMode() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('bookmark_app_theme', state.theme);
      applyTheme();
      saveData();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      t.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* 리스트 상에서 별 아이콘 직접 클릭 토글 기능 */
    function toggleBookmarkStarInline(bmId, event) {
      if (event) event.stopPropagation();
      const bm = state.bookmarks.find(b => b.id === bmId);
      if (bm) {
        bm.isStarred = !bm.isStarred;
        saveData();
        render();
      }
    }

    function toggleStarState() {
      const isStarredInput = document.getElementById('bmIsStarred');
      const starBtn = document.getElementById('starToggleBtn');
      const newState = !(isStarredInput.value === 'true');
      isStarredInput.value = newState ? 'true' : 'false';
      starBtn.classList.toggle('active', newState);
    }

    function render() {
      applyTheme();
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';

      const matches = bm => !query ||
        bm.title.toLowerCase().includes(query) ||
        bm.url.toLowerCase().includes(query) ||
        (bm.desc && bm.desc.toLowerCase().includes(query));

      /* 중요(별) 표시 모음 폴더 (수정/삭제 불가, 최상단 고정) */
      const starredBookmarks = state.bookmarks.filter(bm => bm.isStarred && matches(bm));

      if (starredBookmarks.length > 0 || !query) {
        const starCard = document.createElement('div');
        starCard.className = 'category-card starred-folder';
        starCard.setAttribute('data-id', 'cat-starred-fixed');

        starCard.innerHTML = `
          <div class="category-header">
            <div class="category-title">
              <span class="material-symbols-outlined filled">star</span>
              <span>자주 가는 사이트</span>
              <span class="category-count">${starredBookmarks.length}</span>
            </div>
          </div>
          <ul class="bookmark-list" data-id="cat-starred-fixed">
            ${starredBookmarks.length === 0 ? '<li class="list-empty">별을 클릭해 중요 북마크를 모아보세요.</li>' : ''}
            ${starredBookmarks.map(bm => renderBookmarkItemHtml(bm, true)).join('')}
          </ul>
        `;
        container.appendChild(starCard);
      }

      /* 일반 카테고리 렌더링 */
      state.categories.forEach(cat => {
        const catBookmarks = state.bookmarks.filter(bm => bm.categoryId === cat.id && matches(bm));
        if (query && catBookmarks.length === 0) return;

        const card = document.createElement('div');
        card.className = 'category-card';
        card.setAttribute('data-id', cat.id);

        card.innerHTML = `
          <div class="category-header">
            <div class="category-title">
              <span class="material-symbols-outlined drag-handle" title="드래그하여 폴더 이동">drag_handle</span>
              <span class="category-title-text" onclick="enableInlineEdit('${cat.id}')" title="클릭하여 이름 수정">${escapeHtml(displayName(cat.name))}</span>
              <span class="category-count">${catBookmarks.length}</span>
            </div>
            <div>
              <button class="btn-icon" onclick="deleteCategory('${cat.id}')" title="폴더 삭제" aria-label="폴더 삭제">
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
          </div>
          <ul class="bookmark-list" data-id="${cat.id}">
            ${catBookmarks.map(bm => renderBookmarkItemHtml(bm, false)).join('')}
          </ul>
        `;

        container.appendChild(card);
      });

      if (query && container.children.length === 0) {
        container.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">search_off</span><p>"${escapeHtml(query)}" 에 대한 결과가 없어요.</p></div>`;
      }

      initSortable();
    }

    /* 북마크 항목 아이템 HTML 생성 함수  —  [이동] 제목 ........ [연필][별] */
    function renderBookmarkItemHtml(bm, isInsideStarredFolder = false) {
      return `
        <li class="bookmark-item" data-id="${bm.id}">
          ${!isInsideStarredFolder ? `<span class="material-symbols-outlined drag-handle" title="드래그하여 이동">drag_handle</span>` : ''}
          <a href="${escapeHtml(bm.url)}" target="_blank" rel="noopener noreferrer" class="bookmark-info">
            <div class="bookmark-details">
              <div class="bookmark-title">${escapeHtml(bm.title)}</div>
              ${bm.desc ? `<div class="bookmark-desc">${escapeHtml(bm.desc)}</div>` : ''}
            </div>
          </a>
          <div class="bookmark-actions">
            <button type="button" class="btn-icon" onclick="openBookmarkModal('${bm.id}')" title="수정" aria-label="수정">
              <span class="material-symbols-outlined">edit</span>
            </button>
            <button type="button" class="btn-icon star-btn-inline ${bm.isStarred ? 'is-on' : ''}" onclick="toggleBookmarkStarInline('${bm.id}', event)" title="${bm.isStarred ? '중요 해제' : '중요 표시'}" aria-label="중요 설정 토글">
              <span class="material-symbols-outlined star-icon ${bm.isStarred ? 'active' : ''}">star</span>
            </button>
          </div>
        </li>
      `;
    }

    function initSortable() {
      const container = document.getElementById('categoriesContainer');
      new Sortable(container, {
        animation: 150,
        handle: '.category-header .drag-handle',
        draggable: '.category-card:not(.starred-folder)', /* 중요모음 카드는 드래그 불가능 고정 */
        onEnd: function () {
          const newOrder = Array.from(container.querySelectorAll('.category-card:not(.starred-folder)')).map(card => card.getAttribute('data-id'));
          state.categories.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
          saveData();
        }
      });

      document.querySelectorAll('.bookmark-list').forEach(listEl => {
        if (listEl.getAttribute('data-id') === 'cat-starred-fixed') return; // 중요모음 항목 내 드래그는 예외 처리

        new Sortable(listEl, {
          group: 'bookmarks',
          animation: 150,
          handle: '.bookmark-item .drag-handle',
          onEnd: function (evt) {
            const itemEl = evt.item;
            const bmId = itemEl.getAttribute('data-id');
            const targetCatId = evt.to.getAttribute('data-id');
            
            const bm = state.bookmarks.find(b => b.id === bmId);
            if (bm) bm.categoryId = targetCatId;

            const newBmList = [];
            document.querySelectorAll('.bookmark-list').forEach(ul => {
              const catId = ul.getAttribute('data-id');
              if (catId === 'cat-starred-fixed') return;
              Array.from(ul.children).forEach(li => {
                const id = li.getAttribute('data-id');
                const found = state.bookmarks.find(b => b.id === id);
                if (found && !newBmList.some(item => item.id === found.id)) {
                  found.categoryId = catId;
                  newBmList.push(found);
                }
              });
            });

            state.bookmarks = newBmList;
            saveData();
          }
        });
      });
    }

    /* Modal Operations */
    function openCategoryModal() {
      document.getElementById('catModalTitle').textContent = '새 폴더 추가';
      document.getElementById('catId').value = '';
      document.getElementById('catName').value = '';
      document.getElementById('categoryModal').classList.add('active');
      setTimeout(() => document.getElementById('catName').focus(), 30);
    }

    function openBookmarkModal(bmId = null) {
      const select = document.getElementById('bmCategory');
      select.innerHTML = [...state.categories].sort((a, b) => displayName(a.name).localeCompare(displayName(b.name), 'ko')).map(c => `<option value="${c.id}">${escapeHtml(displayName(c.name))}</option>`).join('');

      const starBtn = document.getElementById('starToggleBtn');
      
      if (bmId) {
        const bm = state.bookmarks.find(b => b.id === bmId);
        if (!bm) return;
        document.getElementById('bmModalTitle').textContent = '북마크 수정';
        document.getElementById('bmId').value = bm.id;
        document.getElementById('bmCategory').value = bm.categoryId;
        document.getElementById('bmTitle').value = bm.title;
        document.getElementById('bmUrl').value = bm.url;
        document.getElementById('bmDesc').value = bm.desc || '';
        document.getElementById('bmIsStarred').value = bm.isStarred ? 'true' : 'false';
        starBtn.classList.toggle('active', !!bm.isStarred);
        document.getElementById('bmDeleteBtn').style.display = 'inline-flex';
      } else {
        document.getElementById('bmModalTitle').textContent = '새 북마크 추가';
        document.getElementById('bmId').value = '';
        document.getElementById('bmTitle').value = '';
        document.getElementById('bmUrl').value = '';
        document.getElementById('bmDesc').value = '';
        document.getElementById('bmIsStarred').value = 'false';
        starBtn.classList.remove('active');
        document.getElementById('bmDeleteBtn').style.display = 'none';
      }

      document.getElementById('bookmarkModal').classList.add('active');
      setTimeout(() => document.getElementById(bmId ? 'bmTitle' : 'bmUrl').focus(), 30);
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    function saveCategory(e) {
      e.preventDefault();
      const name = document.getElementById('catName').value.trim();
      if (!name) return;

      state.categories.push({ id: 'cat-' + Date.now(), name });
      saveData();
      render();
      closeModal('categoryModal');
    }

    function saveBookmark(e) {
      e.preventDefault();
      const id = document.getElementById('bmId').value;
      const categoryId = document.getElementById('bmCategory').value;
      const title = document.getElementById('bmTitle').value.trim();
      const url = document.getElementById('bmUrl').value.trim();
      const desc = document.getElementById('bmDesc').value.trim();
      const isStarred = document.getElementById('bmIsStarred').value === 'true';

      if (id) {
        const bm = state.bookmarks.find(b => b.id === id);
        if (bm) {
          bm.categoryId = categoryId;
          bm.title = title;
          bm.url = url;
          bm.desc = desc;
          bm.isStarred = isStarred;
        }
      } else {
        state.bookmarks.push({ id: 'bm-' + Date.now(), categoryId, title, url, desc, isStarred });
      }

      saveData();
      render();
      closeModal('bookmarkModal');
    }

    function deleteBookmarkFromModal() {
      const id = document.getElementById('bmId').value;
      if (!id) return;
      if (confirm('이 북마크를 삭제하시겠습니까?')) {
        state.bookmarks = state.bookmarks.filter(b => b.id !== id);
        saveData();
        render();
        closeModal('bookmarkModal');
      }
    }

    function deleteCategory(catId) {
      if (confirm('이 폴더를 삭제하시겠습니까? (안에 속한 북마크도 함께 삭제됩니다)')) {
        state.categories = state.categories.filter(c => c.id !== catId);
        state.bookmarks = state.bookmarks.filter(b => b.categoryId !== catId);
        saveData();
        render();
      }
    }

    function enableInlineEdit(catId) {
      const card = document.querySelector(`.category-card[data-id="${catId}"]`);
      if (!card) return;
      const titleTextEl = card.querySelector('.category-title-text');
      const currentName = displayName(state.categories.find(c => c.id === catId)?.name || '');

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'category-edit-input';
      input.value = currentName;

      titleTextEl.replaceWith(input);
      input.focus();
      input.select();

      let done = false;
      const saveInline = () => {
        if (done) return;
        done = true;
        const newName = input.value.trim();
        if (newName) {
          const cat = state.categories.find(c => c.id === catId);
          if (cat) cat.name = newName;
          saveData();
        }
        render();
      };

      input.addEventListener('blur', saveInline);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveInline();
        if (e.key === 'Escape') { done = true; render(); }
      });
    }

    function copyUpdatedHtml() {
      const htmlDoc = document.documentElement.cloneNode(true);
      const scripts = htmlDoc.querySelectorAll('script');
      
      scripts.forEach(script => {
        if (script.textContent.includes('const DEFAULT_DATA =')) {
          const jsonString = JSON.stringify(state, null, 2);
          script.textContent = script.textContent.replace(
            /const DEFAULT_DATA = \{[\s\S]*?\};/,
            () => `const DEFAULT_DATA = ${jsonString};`
          );
        }
      });

      const fullHtml = '<!DOCTYPE html>\n' + htmlDoc.outerHTML;
      navigator.clipboard.writeText(fullHtml).then(() => {
        showToast('최신 HTML 코드가 클립보드에 복사되었어요');
      }).catch(err => {
        alert('복사에 실패했습니다. 권한을 확인해주세요.');
      });
    }

    function resetToDefault() {
      if (confirm('모든 수정을 취소하고 코드 기본값으로 돌아가시겠습니까?')) {
        localStorage.removeItem('bookmark_app_data');
        localStorage.removeItem('bookmark_app_theme');
        state = JSON.parse(JSON.stringify(DEFAULT_DATA));
        render();
        showToast('기본값으로 복원했어요');
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    /* 키보드 단축키: "/" 검색 포커스, Esc 모달 닫기 / 검색 비우기 */
    document.addEventListener('keydown', (e) => {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag);
      if (e.key === '/' && !typing) {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        const open = document.querySelector('.modal.active');
        if (open) { closeModal(open.id); return; }
        const s = document.getElementById('searchInput');
        if (document.activeElement === s) { s.value = ''; s.blur(); render(); }
      }
    });

    /* 모달 바깥(배경) 클릭 시 닫기 */
    document.addEventListener('mousedown', (e) => {
      if (e.target.classList && e.target.classList.contains('modal')) closeModal(e.target.id);
    });

    // Initialize Page
    document.addEventListener('DOMContentLoaded', render);
  </script>

</body></html>
